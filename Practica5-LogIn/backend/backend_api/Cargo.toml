[package]
name = "backend_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha3 = "0.11.0"
colored = "3.1.1"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"]}
chrono = "0.4.44"
dotenvy = "0.15.7"
lettre = { version = "0.11.22", features = ["tokio1", "aws-lc-rs", "tokio1-native-tls", "webpki-roots", "builder"] }
url = "2.5.8"


