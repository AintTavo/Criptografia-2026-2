<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer Contraseña — SYS://SECURE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/secret.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
    }
    .restore-container {
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .restore-container h2 {
      font-family: 'IBM Plex Mono', monospace;
      color: #00ffcc;
      margin-top: 0;
    }
    .input-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 0.5rem;
    }
    .input-group input {
      width: 100%;
      padding: 0.8rem;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
      font-family: inherit;
      box-sizing: border-box;
    }
    .input-group input:focus {
      outline: none;
      border-color: #00ffcc;
    }
    .btn {
      width: 100%;
      padding: 1rem;
      background: #00ffcc;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background: #00ccaa;
    }
    .btn:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .error-msg {
      color: #ff4c4c;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 1rem 2rem;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #toast.show {
      opacity: 1;
    }
    #toast.success { background: #00ffcc; color: #000; }
    #toast.error { background: #ff4c4c; color: #fff; }
  </style>
</head>
<body>

  <div class="restore-container" id="restore-form">
    <h2>NUEVA CONTRASEÑA</h2>
    <p style="font-size: 0.9rem; color: #bbb; margin-bottom: 2rem;">Ingresa tu nueva clave de acceso seguro.</p>
    
    <div class="input-group">
      <label for="new-pass">Contraseña</label>
      <input type="password" id="new-pass" placeholder="Mínimo 8 caracteres" />
      <div class="error-msg" id="pass-err"></div>
    </div>
    <div class="input-group">
      <label for="new-pass-confirm">Confirmar Contraseña</label>
      <input type="password" id="new-pass-confirm" placeholder="Repite la contraseña" />
      <div class="error-msg" id="confirm-err"></div>
    </div>
    
    <button class="btn" id="btn-restore" onclick="submitRestore()">ACTUALIZAR CREDENCIALES</button>
  </div>

  <div id="toast"></div>

  <script src="../js/restore.js"></script>
</body>
</html>
