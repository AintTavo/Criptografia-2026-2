<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificar Cuenta — SYS://SECURE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/secret.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
    }
    .verify-container {
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem;
      border-radius: 8px;
      max-width: 450px;
      width: 100%;
      text-align: center;
    }
    .verify-container h2 {
      font-family: 'IBM Plex Mono', monospace;
      color: #00ffcc;
      margin-top: 0;
    }
    .verify-msg {
      font-size: 1rem;
      color: #bbb;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .btn-home {
      display: inline-block;
      padding: 1rem 2rem;
      background: #00ffcc;
      color: #000;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      font-family: 'IBM Plex Mono', monospace;
      transition: background 0.3s ease;
      display: none; /* Se oculta por defecto */
    }
    .btn-home:hover {
      background: #00ccaa;
    }
    .loader {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #00ffcc;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="verify-container" id="verify-box">
    <div class="loader" id="loader"></div>
    <h2 id="status-title">VERIFICANDO IDENTIDAD</h2>
    <p class="verify-msg" id="status-msg">Validando credenciales criptográficas, por favor espera...</p>
    
    <a href="../index.html" class="btn-home" id="btn-home">IR A INICIAR SESIÓN</a>
  </div>

  <script src="../js/verify.js"></script>
</body>
</html>
